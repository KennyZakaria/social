<router-outlet *ngIf="isPublicPage"></router-outlet>

<div class="shell" *ngIf="!isPublicPage">
  <app-sidebar [modules]="modules" [authState]="authState" (logoutRequested)="logout()"></app-sidebar>

  <div class="main-wrap">
    <app-navbar [authState]="authState" (logoutRequested)="logout()"></app-navbar>
    <main class="page-body"><router-outlet></router-outlet></main>
    <app-footer></app-footer>
  </div>
</div>
