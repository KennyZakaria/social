<header class="navbar">
  <div class="navbar__context">
 
    <div>
      <p class="navbar__eyebrow">Service Social</p>
      <h1 class="navbar__title">Gestion des activités</h1>
    </div>
  </div>

  <div class="navbar__account" *ngIf="authState.auth as me">
    <span class="navbar__status"><i></i> Session sécurisée</span>
    <div class="navbar__user">
      <span class="navbar__user-name">{{ me.fullName }}</span>
      <span class="navbar__user-role">{{ me.role }}</span>
    </div>
    <button type="button" class="navbar__logout" title="Déconnexion" aria-label="Déconnexion" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</header>
